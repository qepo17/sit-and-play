<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The home screen's game row: the selected cover, ringed as in the app, ready to play. -->
  <defs>
    <clipPath id="base">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2438"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="500" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c7dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4c7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="selected" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c7dff"/>
      <stop offset="1" stop-color="#9b5cf6"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#ff3d77"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2290ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="354" y="258" width="316" height="500" rx="46"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g clip-path="url(#base)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ink)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- neighbouring covers, dimmed -->
    <g opacity="0.55">
      <rect x="62" y="352" width="220" height="330" rx="34" fill="url(#left)"/>
      <rect x="742" y="352" width="220" height="330" rx="34" fill="url(#right)"/>
    </g>

    <!-- selected cover with the app's focus ring and halo -->
    <g filter="url(#shadow)">
      <rect x="324" y="228" width="376" height="560" rx="72" fill="none" stroke="#fff" stroke-opacity="0.2" stroke-width="16"/>
      <rect x="348" y="252" width="328" height="512" rx="52" fill="url(#selected)" stroke="#fff" stroke-width="12"/>
    </g>
    <circle cx="450" cy="380" r="190" fill="url(#orb)" clip-path="url(#tile)"/>
    <path d="M466 418 Q466 392 489 405 L605 485 Q626 499 605 514 L489 594 Q466 607 466 582 Z" fill="#fff"/>
  </g>
</svg>
