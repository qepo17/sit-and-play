name: Bug report
description: Report a reproducible problem with Sit and Play.
body:
  - type: markdown
    attributes:
      value: Do not include Steam API keys or your library.json file. Report security issues using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0 or the commit hash"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "Windows 11 or Ubuntu 24.04, x86-64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include whether you use a keyboard, mouse, or controller, and the controller model if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add redacted logs or screenshots if they help explain the problem.
    validations:
      required: true
